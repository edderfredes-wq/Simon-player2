<title>Simón Player</title>
<style>
:root{--bg:#101112;--sf:#222426;--ink:#fff;--mute:#a6a6a6;--ac:#a4b68a;--ln:#2f3235;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.35 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:14px 18px calc(88px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
header h1{font-size:.95rem;letter-spacing:.14em;margin:0;font-weight:700}
.st{font-size:.8rem;color:var(--mute);background:var(--sf);padding:4px 11px;border-radius:99px}
.st.on{color:var(--bg);background:var(--ac)}
[hidden]{display:none!important}
button{transition:transform .12s,background .2s,color .2s}button:active{transform:scale(.93)}
#home,#v2{animation:in .24s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){#home,#v2{animation:none}button{transition:none}}

.info{text-align:center}
.info h2{margin:0;font-size:1.3rem;font-weight:700;overflow-wrap:anywhere}
.info p{margin:3px 0 0;color:var(--mute)}
.seek{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:.8rem;font-variant-numeric:tabular-nums;margin-top:18px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:24px;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--ac) var(--p,0%),var(--ln) var(--p,0%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--ln)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--ac)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ac);margin-top:-5px;border:0}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ac);border:0}
button{font:inherit;color:var(--ink);background:none;border:0;cursor:pointer;border-radius:50%}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ctl{display:flex;justify-content:center;align-items:center;gap:8px;margin:8px 0}
.ctl button{width:46px;height:46px;display:grid;place-items:center;position:relative}
svg{width:22px;height:22px;fill:currentColor}
.ctl .pl{width:64px;height:64px;background:var(--ac);color:var(--bg)}
.ctl .pl svg{width:30px;height:30px}
.ctl .on{color:var(--ac)}
#rep[data-r="2"]::after{content:"1";position:absolute;font-size:.6rem;font-weight:700;bottom:7px;right:9px}
.vol{display:flex;align-items:center;gap:8px;max-width:220px;margin:0 auto;color:var(--mute)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:460px}
nav button{flex:1;border-radius:0;padding:10px 0 9px;font-size:.72rem;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--ac)}
.bar{display:flex;gap:8px;margin-bottom:12px}
.bar label,.btn{background:var(--ac);color:var(--bg);font-weight:600;border-radius:99px;padding:9px 16px;cursor:pointer;font-size:.88rem;white-space:nowrap;display:inline-block;width:auto;height:auto}
.bar label input{position:absolute;opacity:0;width:1px;height:1px}
.btn.alt{background:var(--sf);color:var(--ink)}
input[type=search],input[type=text]{flex:1;min-width:0;background:var(--sf);border:1px solid var(--ln);color:var(--ink);border-radius:99px;padding:9px 14px;font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.chips button{background:var(--sf);color:var(--mute);border-radius:99px;padding:6px 13px;font-size:.84rem;white-space:nowrap}
.chips button.on{background:var(--ac);color:var(--bg)}
h3{font-size:.85rem;color:var(--ac);margin:16px 0 4px;font-weight:600}
.row{display:flex;align-items:center;gap:11px;padding:8px 0;border-top:1px solid var(--ln);cursor:pointer}
.row.cur b{color:var(--ac)}
.row img,.ph{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--sf)}
.ph{display:grid;place-items:center;color:var(--ac);font-weight:700;font-size:.8rem}
.m{flex:1;min-width:0}.m b,.m span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m span{color:var(--mute);font-size:.82rem}
.row button{width:34px;height:34px;color:var(--mute);font-size:1rem}
.row button.on{color:var(--ac)}
.empty{color:var(--mute);text-align:center;padding:36px 10px;line-height:1.5}
.sheet{background:var(--sf);border-radius:16px;padding:14px;margin-bottom:12px}
.sheet p{margin:0 0 10px}.sheet .btn{margin:0 6px 6px 0}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--ln)}
.set .chips{margin:0}
.eq{display:flex;gap:6px;justify-content:space-between;margin:10px 0}
.eq div{flex:1;text-align:center;color:var(--mute);font-size:.72rem}
.eq input{writing-mode:vertical-lr;direction:rtl;width:24px;height:120px;-webkit-appearance:slider-vertical;appearance:slider-vertical;background:none}
.drop{outline:2px dashed var(--ac);outline-offset:-6px}
.deck{position:relative;max-width:var(--dk,460px);margin:0 auto;padding:14px;border-radius:22px;background:linear-gradient(160deg,#2b2d30,#1b1c1e 60%,#202225);border:1px solid #3a3d41;box-shadow:0 24px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 4px #17181a}
.sc{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8b9097,#3b3e42);box-shadow:0 0 0 1px #121314}
.sc.a{top:9px;left:9px}.sc.b{top:9px;right:9px}.sc.c{bottom:9px;left:9px}.sc.d{bottom:9px;right:9px}
.stage{position:relative;container-type:inline-size;aspect-ratio:100/90;border-radius:14px;background:linear-gradient(#18191b,#141516);box-shadow:inset 0 2px 8px rgba(0,0,0,.7)}
.platter{position:absolute;left:3cqw;top:8cqw;width:74cqw;height:74cqw;padding:3.2cqw;border-radius:50%;background:conic-gradient(from 20deg,#2a2d30,#53585d,#2a2d30,#4b5055,#2a2d30);box-shadow:0 2.4cqw 5cqw rgba(0,0,0,.6)}
#deck .face{width:100%;height:100%;margin:0;background-size:106%;box-shadow:0 0 0 .5cqw #101112}
.pivot{position:absolute;left:82cqw;top:8cqw;width:12cqw;height:12cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7b8087,#2c2f33 70%);box-shadow:0 1cqw 2cqw rgba(0,0,0,.6)}
.pivot::after{content:"";position:absolute;inset:4.6cqw;border-radius:50%;background:var(--ac)}
.rest{position:absolute;left:86.5cqw;top:71cqw;width:3cqw;height:8cqw;border-radius:1cqw;background:linear-gradient(#656a70,#30333a)}
.arm{position:absolute;left:88cqw;top:14cqw;width:0;height:0;transform:rotate(var(--arm,0deg));transition:transform 1.5s cubic-bezier(.45,.05,.25,1)}
.arm svg{position:absolute;left:-10cqw;top:-14cqw;width:20cqw;height:84cqw;overflow:visible;filter:drop-shadow(0 1cqw 1.4cqw rgba(0,0,0,.55))}
.plate{background:#151617;border-radius:10px;padding:12px 14px 4px;margin:14px 0;box-shadow:inset 0 2px 6px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.06)}
.plate h2{margin:0;font-size:1.05rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate p{margin:2px 0 0;color:var(--mute);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.1em}
#deck .seek{margin-top:6px}
#deck .ctl{justify-content:space-between;margin:2px 0}
.keys{display:flex;gap:6px;align-items:center}
#deck .key{position:relative;width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:#cfd3d6;background:linear-gradient(#3d4044,#26282b);border:1px solid #4a4e53;box-shadow:0 3px 0 #101112,inset 0 1px 0 rgba(255,255,255,.12);transition:transform .08s,box-shadow .08s}
#deck .key:active{transform:translateY(2px);box-shadow:0 1px 0 #101112,inset 0 1px 0 rgba(255,255,255,.12)}
#deck .key::before{content:"";position:absolute;top:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#131415}
#deck .key.on::before,#deck.on .pl::before{background:var(--ac);box-shadow:0 0 5px rgba(164,182,138,.7)}
#deck .key.on{color:#cfd3d6}
#deck .pl{width:56px;height:48px;background:linear-gradient(#4a4e53,#2c2f33);color:#e7e9ea}
#deck .pl svg{width:26px;height:26px}#deck .key svg{width:19px;height:19px}
#rep[data-r="2"]::after{bottom:5px;right:6px}
.knob{position:relative;width:58px;height:58px;flex:none;border-radius:50%;touch-action:none;cursor:grab;background:radial-gradient(circle at 35% 30%,#51555a,#222426 72%);box-shadow:0 3px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14),0 0 0 3px #17181a}
.knob i{position:absolute;inset:0;transform:rotate(var(--kr,0deg))}
.knob i::after{content:"";position:absolute;left:50%;top:6px;width:3px;height:14px;margin-left:-1.5px;border-radius:2px;background:var(--ac)}
@media (prefers-reduced-motion:reduce){.arm{transition:none}}
.platter{touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#deck{touch-action:pan-y;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#deck .keys,#deck .plate h2{-webkit-user-select:none;user-select:none}
.knob b{position:absolute;inset:0;display:grid;place-items:center;font:600 .68rem Inter,system-ui,sans-serif;color:var(--mute);pointer-events:none}
</style>
</head>
<body>
<main id="app">
<header><h1>SIMÓN PLAYER</h1><span class="st" id="st">En pausa</span></header>

<section id="home">
  <div class="deck" id="deck">
    <i class="sc a"></i><i class="sc b"></i><i class="sc c"></i><i class="sc d"></i>
    <div class="stage" id="stage">
      <div class="platter"><div class="face" id="face" role="img" aria-label="Simón"></div></div>
      <div class="pivot"></div><div class="rest"></div>
      <div class="arm"><svg viewBox="0 -70 100 420" aria-hidden="true">
        <rect x="35" y="-64" width="30" height="46" rx="7" fill="#2f3235" stroke="#5a5f65"/><rect x="35" y="-46" width="30" height="3" fill="#a4b68a"/>
        <line x1="50" y1="-18" x2="50" y2="288" stroke="#9aa0a6" stroke-width="7" stroke-linecap="round"/>
        <line x1="48" y1="-14" x2="48" y2="286" stroke="#e4e7ea" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
        <circle cx="50" cy="0" r="12" fill="#3a3d41" stroke="#6b7076"/>
        <path d="M39 284h22l4 28H35z" fill="#25272a" stroke="#6b7076"/><rect x="35" y="302" width="30" height="4" fill="#a4b68a"/><path d="M47 312h6l-3 9z" fill="#d6d9dc"/>
      </svg></div>
    </div>
    <div class="plate">
      <h2 id="tt">Sin canción</h2><p id="ar">Agrega música desde Biblioteca</p><p id="al"></p>
      <div class="seek"><span id="cu">0:00</span><input type="range" id="sk" min="0" max="1000" value="0" aria-label="Posición"><span id="du">0:00</span></div>
    </div>
    <div class="ctl">
      <div class="keys">
        <button class="key" id="sh" aria-label="Aleatorio"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-3.1 4.2L8.9 8.9 11 6h6V3zM3 7h4.1l2.2 3-1.4 1.9L6.1 9H3V7zm0 8h3.1l2.3-3.2 1.4 1.9L7.1 17H3v-2zm11.4-.8L17 17v-3l4 4-4 4v-3h-3.1l-2.4-3.3 2.9-1.5z"/></svg></button>
        <button class="key" id="pv" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="key pl" id="pp" aria-label="Reproducir"><svg id="ic" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="key" id="nx" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg></button>
        <button class="key" id="rep" aria-label="Repetir"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
      </div>
      <div class="knob" id="kn" role="slider" tabindex="0" aria-label="Volumen" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80"><i></i><b id="vl"></b></div>
    </div>
  </div>
</section>

<section id="v2" hidden></section>
<audio id="au" preload="metadata"></audio>
</main>

<nav><div id="nav">
  <button data-v="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9h-6v-6H9v6H3z"/></svg>Inicio</button>
  <button data-v="lib"><svg viewBox="0 0 24 24"><path d="M9 3v10.5A3.5 3.5 0 1 0 11 17V7h6V3z"/></svg>Biblioteca</button>
  <button data-v="lists"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h12v2H3z"/></svg>Listas</button>
  <button data-v="set"><svg viewBox="0 0 24 24"><path d="M4 7h9V5h2v2h5v2h-5v2h-2V9H4zm0 8h5v-2h2v2h9v2h-9v2H9v-2H4z"/></svg>Ajustes</button>
</div></nav>

<script>
(function(){
var $=function(s){return document.querySelector(s)},A=$('#au'),V=$('#v2');
var DEF={fav:[],lists:[],rec:[],rot:true,spd:7.5,eq:[0,0,0,0,0],pn:true,rem:false,dsz:'big',amp:100};
var S=(function(){try{return Object.assign({},DEF,JSON.parse(localStorage.getItem('sp')||'{}'))}catch(e){return Object.assign({},DEF)}})();
function save(){try{localStorage.setItem('sp',JSON.stringify(S))}catch(e){}}
var T=[],Q=[],qi=-1,shuf=false,rep=0,view='home',tab='all',openL=null,qy='',sheet=null,VIS=[],sleepT=null,sleepM=0,delArm=null,ctx=null,filt=null,amp=null,lim=null,scrub=false,swp=false;
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var fmtR=function(v){return(+v).toFixed(1).replace('.',',')};var fmt=function(s){if(!isFinite(s))return'0:00';var m=Math.floor(s/60),r=Math.floor(s%60);return m+':'+(r<10?'0':'')+r};
var paint=function(e){e.style.setProperty('--p',e.value/e.max*100+'%')};
var cur=function(){return qi>=0?T[Q[qi]]:null};
var PLAY='<path d="M8 5v14l11-7z"/>',PAUSE='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

/* etiquetas ID3 (título, artista, álbum, portada) */
function txt(d){var e=d[0],b=d.subarray(1),enc=e===3?'utf-8':e===0?'iso-8859-1':(e===2||(b[0]===254&&b[1]===255))?'utf-16be':'utf-16le';try{return new TextDecoder(enc).decode(b).replace(/\0+$/,'').replace(/^\uFEFF/,'')}catch(x){return''}}
async function tags(f){
  var o={title:f.name.replace(/\.[^.]+$/,'').replace(/_/g,' '),artist:'Artista desconocido',album:'Álbum desconocido',cover:null};
  try{
    var h=new Uint8Array(await f.slice(0,10).arrayBuffer());
    if(h[0]!==73||h[1]!==68||h[2]!==51||h[3]<3)return o;
    var v=h[3],n=(h[6]<<21)|(h[7]<<14)|(h[8]<<7)|h[9],b=new Uint8Array(await f.slice(10,10+Math.min(n,8e6)).arrayBuffer()),p=0;
    var sz=function(i){return v===4?(b[i]<<21)|(b[i+1]<<14)|(b[i+2]<<7)|b[i+3]:b[i]*16777216+(b[i+1]<<16)+(b[i+2]<<8)+b[i+3]};
    if(h[5]&64)p=sz(0)+(v===3?4:0);
    while(p+10<b.length){
      var id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
      var fs=sz(p+4);if(fs<=0)break;var d=b.subarray(p+10,p+10+fs);p+=10+fs;
      if(id==='TIT2')o.title=txt(d)||o.title;else if(id==='TPE1')o.artist=txt(d)||o.artist;else if(id==='TALB')o.album=txt(d)||o.album;
      else if(id==='APIC'&&!o.cover){
        var i=1;while(i<d.length&&d[i])i++;var mime=String.fromCharCode.apply(null,d.subarray(1,i));i+=2;
        if(d[0]===1||d[0]===2){while(i<d.length-1&&!(d[i]===0&&d[i+1]===0))i+=2;i+=2}else{while(i<d.length&&d[i])i++;i++}
        if(i<d.length)o.cover=URL.createObjectURL(new Blob([d.subarray(i)],{type:mime.indexOf('/')>0?mime:'image/jpeg'}));
      }
    }
  }catch(e){}
  return o;
}

async function add(files){
  for(var k=0;k<files.length;k++){
    var f=files[k];if(!/audio|\.mp3$/i.test(f.type+f.name))continue;
    var key=f.name+'|'+f.size;if(T.some(function(t){return t.key===key}))continue;
    var m=await tags(f);m.key=key;m.url=URL.createObjectURL(f);m.folder=(f.webkitRelativePath||'').split('/').slice(0,-1).join('/')||'Archivos sueltos';T.push(m);
  }
  if(qi<0&&T.length)start(T.map(function(_,i){return i}),0,false);
  draw();
}

function start(q,pos,go){Q=q;qi=pos;A.src=cur().url;info();if(go)A.play().catch(function(){});draw()}
function step(d){
  if(!Q.length)return;
  if(shuf&&Q.length>1){var n;do{n=Math.floor(Math.random()*Q.length)}while(n===qi);qi=n}else qi=(qi+d+Q.length)%Q.length;
  A.src=cur().url;info();A.play().catch(function(){});draw();
}
function info(){
  var t=cur();
  $('#tt').textContent=t?t.title:'Sin canción';$('#ar').textContent=t?t.artist:'Agrega música desde Biblioteca';$('#al').textContent=t?t.album:'';
  $('#sk').value=0;paint($('#sk'));$('#cu').textContent='0:00';$('#du').textContent='0:00';
  document.title=t?t.title+' · Simón Player':'Simón Player';
  if(t&&'mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album,artwork:t.cover?[{src:t.cover}]:[]})}catch(e){}}
}
function rec(){var t=cur();if(!t)return;var x=S.rec.indexOf(t.key);if(x>=0)S.rec.splice(x,1);S.rec.unshift(t.key);S.rec=S.rec.slice(0,50);save()}
function toggle(){if(!T.length){go('lib');return}A.paused?A.play().catch(function(){}):A.pause()}

/* ecualizador de 5 bandas */
function eqInit(){
  if(ctx)return;
  try{
    ctx=new(window.AudioContext||window.webkitAudioContext)();var s=ctx.createMediaElementSource(A);
    filt=[60,230,910,3600,14000].map(function(f,i){var b=ctx.createBiquadFilter();b.type=i===0?'lowshelf':i===4?'highshelf':'peaking';b.frequency.value=f;b.gain.value=S.eq[i];return b});
    amp=ctx.createGain();lim=ctx.createDynamicsCompressor();lim.knee.value=0;lim.attack.value=.003;lim.release.value=.12;applyAmp();
    [s].concat(filt,[amp,lim,ctx.destination]).reduce(function(a,b){a.connect(b);return b});
  }catch(e){ctx=null}
}

/* disco: gira a 33⅓ rpm con arranque y frenado graduales */
var face=$('#face'),ang=0,w=0,last=0,tgt=0,w0=0,t0=0;
function spin(t){
  var dt=Math.min(.05,(t-last)/1000||0);last=t;
  var target=((!A.paused||(scrub&&swp))&&S.rot)?S.spd*6:0;
  if(target!==tgt){tgt=target;w0=w;t0=t}
  var k=Math.min(1,(t-t0)/(tgt>w0?3000:2500));
  w=w0+(tgt-w0)*k*k*(3-2*k);
  if(!scrub)ang=(ang+w*dt)%360;
  face.style.transform='rotate('+ang+'deg)';requestAnimationFrame(spin);
}
requestAnimationFrame(spin);
var stage=$('#stage');
function arm(){var pr=A.duration?A.currentTime/A.duration:0;stage.style.setProperty('--arm',(A.paused&&!scrub?0:28+10*pr)+'deg')}
function deck(on){$('#deck').classList.toggle('on',!!on);arm()}

A.onplay=function(){rec();deck(1);eqInit();if(ctx&&ctx.resume)ctx.resume();$('#ic').innerHTML=PAUSE;$('#st').textContent='Reproduciendo';$('#st').className='st on';$('#pp').setAttribute('aria-label','Pausar')};
A.onpause=function(){if(scrub)return;deck(0);$('#ic').innerHTML=PLAY;$('#st').textContent='En pausa';$('#st').className='st';$('#pp').setAttribute('aria-label','Reproducir')};
A.onloadedmetadata=function(){$('#du').textContent=fmt(A.duration)};
A.ontimeupdate=function(){if(!A.duration)return;arm();$('#cu').textContent=fmt(A.currentTime);if(S.rem)$('#du').textContent='-'+fmt(A.duration-A.currentTime);$('#sk').value=A.currentTime/A.duration*1000;paint($('#sk'))};
A.onended=function(){if(rep===2){A.currentTime=0;A.play();return}if(!S.pn&&rep!==1){A.currentTime=0;return}if(!shuf&&qi===Q.length-1&&rep===0){A.currentTime=0;return}step(1)};
A.onerror=function(){if(cur())$('#ar').textContent='No se pudo leer este archivo'};
$('#pp').onclick=toggle;$('#nx').onclick=function(){step(1)};
$('#pv').onclick=function(){if(A.currentTime>3)A.currentTime=0;else step(-1)};
$('#sh').onclick=function(){shuf=!shuf;this.classList.toggle('on',shuf)};
$('#rep').onclick=function(){rep=(rep+1)%3;this.classList.toggle('on',rep>0);this.dataset.r=rep};
$('#sk').oninput=function(){paint(this);if(A.duration)A.currentTime=this.value/1000*A.duration};
var kn=$('#kn'),vol=80;
function setVol(v){v=Math.max(0,Math.min(100,v));vol=v;A.volume=v/100;kn.style.setProperty('--kr',(-135+v*2.7)+'deg');kn.setAttribute('aria-valuenow',Math.round(v));$('#vl').textContent=Math.round(v)}
function ptr(e){var r=kn.getBoundingClientRect(),a=Math.atan2(e.clientX-(r.left+r.width/2),-(e.clientY-(r.top+r.height/2)))*180/Math.PI;a=Math.max(-135,Math.min(135,a));setVol((a+135)/2.7)}
kn.addEventListener('pointerdown',function(e){kn.setPointerCapture(e.pointerId);kn.drag=1;ptr(e)});
kn.addEventListener('pointermove',function(e){if(kn.drag)ptr(e)});
kn.addEventListener('pointerup',function(){kn.drag=0});
kn.addEventListener('keydown',function(e){var d=e.key==='ArrowUp'||e.key==='ArrowRight'?5:e.key==='ArrowDown'||e.key==='ArrowLeft'?-5:0;if(d){e.preventDefault();setVol(vol+d)}});
setVol(80);
/* disco interactivo: arrastrar con el dedo adelanta o retrocede (1 vuelta = 10 s) */
var pl=document.querySelector('.platter'),SEC=10,sc={a:0,t:0,tot:0};
function angOf(e){var r=pl.getBoundingClientRect();return Math.atan2(e.clientX-(r.left+r.width/2),-(e.clientY-(r.top+r.height/2)))*180/Math.PI}
pl.addEventListener('pointerdown',function(e){
  if(!cur()||!A.duration)return;
  pl.setPointerCapture(e.pointerId);scrub=true;swp=!A.paused;sc.a=angOf(e);sc.t=A.currentTime;sc.tot=0;
  if(swp)A.pause();
});
pl.addEventListener('pointermove',function(e){
  if(!scrub)return;
  var a=angOf(e),d=a-sc.a;if(d>180)d-=360;if(d<-180)d+=360;sc.a=a;sc.tot+=d;ang=(ang+d+360)%360;
  A.currentTime=Math.max(0,Math.min(A.duration,sc.t+sc.tot/360*SEC));
  if(A.ontimeupdate)A.ontimeupdate();
});
function endScrub(){if(!scrub)return;scrub=false;if(swp){swp=false;A.play().catch(function(){})}}
pl.addEventListener('pointerup',endScrub);pl.addEventListener('pointercancel',endScrub);
/* deslizar a los lados para cambiar de canción (fuera del disco y de los controles) */
var sw=null,dk=$('#deck');
dk.addEventListener('pointerdown',function(e){if(e.target.closest('.platter,input,.knob,.keys'))return;sw={x:e.clientX,y:e.clientY,t:Date.now()}});
dk.addEventListener('pointerup',function(e){if(!sw)return;var dx=e.clientX-sw.x,dy=e.clientY-sw.y,dt=Date.now()-sw.t;sw=null;if(dt<700&&Math.abs(dx)>60&&Math.abs(dx)>2*Math.abs(dy))step(dx<0?1:-1)});
dk.addEventListener('pointercancel',function(){sw=null});
/* mantener anterior o siguiente: retroceder o adelantar 5 s cada 0,2 s */
function hold(btn,dir){
  var t,iv,held=false;
  function end(){clearTimeout(t);clearInterval(iv)}
  btn.addEventListener('pointerdown',function(){held=false;t=setTimeout(function(){held=true;iv=setInterval(function(){if(A.duration)A.currentTime=Math.max(0,Math.min(A.duration,A.currentTime+dir*5))},200)},450)});
  ['pointerup','pointerleave','pointercancel'].forEach(function(n){btn.addEventListener(n,end)});
  btn.addEventListener('click',function(e){if(held){e.stopImmediatePropagation();held=false}},true);
  btn.addEventListener('contextmenu',function(e){e.preventDefault()});
}
hold($('#pv'),-1);hold($('#nx'),1);

if('mediaSession' in navigator){[['play',function(){A.play()}],['pause',function(){A.pause()}],['nexttrack',function(){step(1)}],['previoustrack',function(){step(-1)}]].forEach(function(a){try{navigator.mediaSession.setActionHandler(a[0],a[1])}catch(e){}})}

function size(){var r=document.documentElement.style;r.setProperty('--dk',S.dsz==='sm'?'340px':'460px')}size();
/* navegación */
function go(v){view=v;openL=null;sheet=null;$('#home').hidden=v!=='home';V.hidden=v==='home';
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});draw()}
$('#nav').onclick=function(e){var b=e.target.closest('button');if(b)go(b.dataset.v)};

/* vistas */
function row(i,pos){
  var t=T[i],isc=cur()===t;
  return '<div class="row'+(isc?' cur':'')+'" data-p="'+pos+'">'+(t.cover?'<img alt="" src="'+t.cover+'">':'<div class="ph">SP</div>')+
  '<div class="m"><b>'+esc(t.title)+'</b><span>'+esc(t.artist)+' · '+esc(t.album)+'</span></div>'+
  '<button data-fav="'+i+'" aria-label="Favorito" class="'+(S.fav.indexOf(t.key)>=0?'on':'')+'">♥</button><button data-add="'+i+'" aria-label="Añadir a lista">＋</button></div>';
}
function lib(){
  var h='<div class="bar"><input type="search" id="q" placeholder="Buscar canciones" value="'+esc(qy)+'"><label>Agregar<input type="file" id="fi" accept="audio/*,.mp3" multiple></label><label>Carpeta<input type="file" id="fd" webkitdirectory multiple></label></div>'+
  '<div class="chips" id="tabs">'+[['all','Canciones'],['album','Álbumes'],['artist','Artistas'],['folder','Carpetas'],['fav','Favoritos'],['recent','Recientes']].map(function(x){return '<button data-tab="'+x[0]+'" class="'+(tab===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>';
  if(sheet!==null){
    h+='<div class="sheet"><p>Añadir «'+esc(T[sheet].title)+'» a:</p>'+(S.lists.length?S.lists.map(function(l){return '<button class="btn alt" data-to="'+l.id+'">'+esc(l.name)+'</button>'}).join(''):'<p style="color:var(--mute)">Todavía no tienes listas. Crea una en la pestaña Listas.</p>')+'<button class="btn" data-x="1">Cerrar</button></div>';
  }
  var ids=T.map(function(_,i){return i}).filter(function(i){var t=T[i],s=qy.toLowerCase();return(!s||(t.title+t.artist+t.album).toLowerCase().indexOf(s)>=0)&&(tab!=='fav'||S.fav.indexOf(t.key)>=0)&&(tab!=='recent'||S.rec.indexOf(t.key)>=0)});
  var G=tab==='album'||tab==='artist'||tab==='folder';
  if(G)ids.sort(function(a,b){return T[a][tab].localeCompare(T[b][tab])});
  if(tab==='recent')ids.sort(function(a,b){return S.rec.indexOf(T[a].key)-S.rec.indexOf(T[b].key)});
  VIS=ids;
  if(!T.length)return h+'<div class="empty">Aún no hay canciones. Toca Agregar y elige tus archivos MP3, o arrástralos a esta página.</div>';
  if(!ids.length)return h+'<div class="empty">No hay resultados.</div>';
  var g=null;
  ids.forEach(function(i,pos){if(G&&T[i][tab]!==g){g=T[i][tab];h+='<h3>'+esc(g)+'</h3>'}h+=row(i,pos)});
  return h;
}
function listsView(){
  var h='';
  if(openL===null){
    h+='<div class="bar"><input type="text" id="nl" placeholder="Nombre de la lista"><button class="btn" data-newl="1">Crear</button></div>';
    if(!S.lists.length)return h+'<div class="empty">Crea tu primera lista y añade canciones desde Biblioteca con el botón ＋.</div>';
    S.lists.forEach(function(l){h+='<div class="row" data-open="'+l.id+'"><div class="m"><b>'+esc(l.name)+'</b><span>'+l.keys.length+(l.keys.length===1?' canción':' canciones')+'</span></div></div>'});
    return h;
  }
  var L=S.lists.filter(function(l){return l.id===openL})[0];if(!L){openL=null;return listsView()}
  h+='<div class="bar"><button class="btn alt" data-back="1">Volver</button><input type="text" id="rn" value="'+esc(L.name)+'" aria-label="Nombre"><button class="btn alt" data-ren="1">Guardar</button></div>'+
  '<div class="bar"><button class="btn" data-playl="1">Reproducir</button><button class="btn alt" data-dell="1">'+(delArm===L.id?'Toca otra vez para eliminar':'Eliminar lista')+'</button></div>';
  var miss=0;
  L.keys.forEach(function(k,n){
    var i=T.findIndex(function(t){return t.key===k});if(i<0){miss++;return}
    var t=T[i];h+='<div class="row" data-lp="'+n+'">'+(t.cover?'<img alt="" src="'+t.cover+'">':'<div class="ph">SP</div>')+'<div class="m"><b>'+esc(t.title)+'</b><span>'+esc(t.artist)+'</span></div><button data-mv="'+n+'|-1" aria-label="Subir">▲</button><button data-mv="'+n+'|1" aria-label="Bajar">▼</button><button data-rm="'+n+'" aria-label="Quitar de la lista">✕</button></div>';
  });
  if(!L.keys.length)h+='<div class="empty">La lista está vacía.</div>';
  if(miss)h+='<p style="color:var(--mute)">'+miss+' sin cargar: vuelve a agregar esos archivos en Biblioteca.</p>';
  return h;
}
var PRE=[['Plano',[0,0,0,0,0]],['Graves',[6,4,0,0,0]],['Rock',[4,2,-2,3,4]],['Voz',[-2,0,4,3,-1]]];
function settings(){
  var h='<div class="set"><span>Rotación del disco</span><input type="checkbox" id="rot" '+(S.rot?'checked':'')+'></div>'+
  '<div class="set" style="display:block"><div style="display:flex;justify-content:space-between"><span>Velocidad de rotación</span><span id="spv" style="color:var(--mute)">'+fmtR(S.spd)+' rpm</span></div><input type="range" id="spd" min="2" max="33.3" step="0.1" value="'+S.spd+'" aria-label="Velocidad de rotación"><div class="chips" style="margin:6px 0 0"><button data-spd="7.5">Suave 7,5</button><button data-spd="15">Media 15</button><button data-spd="33.3">Vinilo 33⅓</button></div></div>'+
  '<div class="set"><span>Pasar a la siguiente al terminar</span><input type="checkbox" id="pn" '+(S.pn?'checked':'')+'></div>'+
  '<div class="set"><span>Mostrar tiempo restante</span><input type="checkbox" id="rem" '+(S.rem?'checked':'')+'></div>'+
  '<div class="set"><span>Tamaño del tocadiscos</span><div class="chips">'+[['big','Grande'],['sm','Compacto']].map(function(x){return '<button data-dsz="'+x[0]+'" class="'+(S.dsz===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div></div>'+
  '<div class="set"><span>Apagado en</span><div class="chips">'+[[0,'No'],[15,'15 min'],[30,'30 min'],[60,'60 min']].map(function(x){return '<button data-sl="'+x[0]+'" class="'+(sleepM===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div></div>'+
  '<div class="set" style="display:block"><div style="display:flex;justify-content:space-between"><span>Amplificación de volumen</span><span id="apv" style="color:var(--ac)">'+S.amp+' %</span></div><input type="range" id="amp" min="100" max="200" step="25" value="'+S.amp+'" aria-label="Amplificación de volumen"><div class="chips" style="margin:6px 0 0">'+[100,125,150,175,200].map(function(v){return '<button data-amp="'+v+'" class="'+(S.amp===v?'on':'')+'">'+v+'</button>'}).join('')+'</div><p id="apw" style="color:var(--mute);font-size:.8rem;margin:8px 0 0">'+ampNote()+'</p></div>'+
  '<div class="set" style="display:block"><span>Ecualizador</span><div class="chips" style="margin-top:8px">'+PRE.map(function(p,i){return '<button data-pre="'+i+'">'+p[0]+'</button>'}).join('')+'</div>'+
  '<div class="eq">'+['60','230','910','3,6k','14k'].map(function(l,i){return '<div><input type="range" min="-12" max="12" value="'+S.eq[i]+'" data-eq="'+i+'" aria-label="Banda '+l+' Hz"><br>'+l+'</div>'}).join('')+'</div></div>'+
  '<div class="set"><button class="btn alt" data-reset="1">Restablecer preferencias</button></div>'+
  '<div class="set"><span style="color:var(--mute)">Simón Player · versión 1.0 · tema oscuro</span></div>';
  return h;
}
function draw(){
  if(view==='lib')V.innerHTML=lib();else if(view==='lists')V.innerHTML=listsView();else if(view==='set')V.innerHTML=settings();
  if(view==='lib'&&document.activeElement===document.body&&qy){var q=$('#q');if(q){q.focus();q.setSelectionRange(qy.length,qy.length)}}
}

function toList(id,i){var L=S.lists.filter(function(l){return l.id===id})[0];if(L&&L.keys.indexOf(T[i].key)<0)L.keys.push(T[i].key);save()}
V.addEventListener('click',function(e){
  var t=e.target,b;
  if((b=t.closest('[data-fav]'))){var k=T[b.dataset.fav].key,x=S.fav.indexOf(k);x>=0?S.fav.splice(x,1):S.fav.push(k);save();draw();return}
  if((b=t.closest('[data-add]'))){sheet=+b.dataset.add;draw();return}
  if((b=t.closest('[data-to]'))){toList(b.dataset.to,sheet);sheet=null;draw();return}
  if(t.closest('[data-x]')){sheet=null;draw();return}
  if((b=t.closest('[data-tab]'))){tab=b.dataset.tab;draw();return}
  if((b=t.closest('[data-p]'))){start(VIS.slice(),+b.dataset.p,true);return}
  if(t.closest('[data-newl]')){var n=$('#nl').value.trim();if(n){S.lists.push({id:'l'+Date.now(),name:n,keys:[]});save();draw()}return}
  if((b=t.closest('[data-open]'))){openL=b.dataset.open;delArm=null;draw();return}
  var L=S.lists.filter(function(l){return l.id===openL})[0];
  if(t.closest('[data-back]')){openL=null;draw();return}
  if(L){
    if(t.closest('[data-ren]')){var nm=$('#rn').value.trim();if(nm){L.name=nm;save();draw()}return}
    if(t.closest('[data-dell]')){if(delArm===L.id){S.lists=S.lists.filter(function(l){return l!==L});openL=null;delArm=null;save()}else delArm=L.id;draw();return}
    if(t.closest('[data-playl]')){var q=[];L.keys.forEach(function(k){var i=T.findIndex(function(x){return x.key===k});if(i>=0)q.push(i)});if(q.length)start(q,0,true);return}
    if((b=t.closest('[data-mv]'))){var p=b.dataset.mv.split('|'),n1=+p[0],n2=n1+ +p[1];if(n2>=0&&n2<L.keys.length){var tmp=L.keys[n1];L.keys[n1]=L.keys[n2];L.keys[n2]=tmp;save();draw()}return}
    if((b=t.closest('[data-rm]'))){L.keys.splice(+b.dataset.rm,1);save();draw();return}
    if((b=t.closest('[data-lp]'))){var q2=[],pos=0;L.keys.forEach(function(k,n){var i=T.findIndex(function(x){return x.key===k});if(i>=0){if(n===+b.dataset.lp)pos=q2.length;q2.push(i)}});start(q2,pos,true);return}
  }
  if((b=t.closest('[data-amp]'))){setAmp(+b.dataset.amp);return}
  if((b=t.closest('[data-dsz]'))){S.dsz=b.dataset.dsz;save();size();draw();return}
  if((b=t.closest('[data-spd]'))){S.spd=+b.dataset.spd;save();draw();return}
  if((b=t.closest('[data-sl]'))){sleepM=+b.dataset.sl;clearTimeout(sleepT);if(sleepM)sleepT=setTimeout(function(){A.pause();sleepM=0;if(view==='set')draw()},sleepM*60000);draw();return}
  if((b=t.closest('[data-pre]'))){S.eq=PRE[b.dataset.pre][1].slice();save();applyEq();draw();return}
  if(t.closest('[data-reset]')){S.rot=DEF.rot;S.spd=DEF.spd;S.eq=DEF.eq.slice();S.pn=DEF.pn;S.rem=DEF.rem;S.dsz=DEF.dsz;S.amp=DEF.amp;applyAmp();size();save();applyEq();draw()}
});
function applyAmp(){if(!amp)return;amp.gain.value=S.amp/100;lim.threshold.value=S.amp>100?-6:0;lim.ratio.value=S.amp>100?20:1}
function ampNote(){return S.amp>100?'Volumen amplificado con limitador. Escuchar fuerte por mucho rato puede dañar la audición: usa los niveles altos solo cuando lo necesites y por poco tiempo.':'100 % es el volumen normal. Puedes amplificar hasta 200 %; el volumen del teléfono se controla aparte.'}
function setAmp(v){S.amp=v;save();applyAmp();var a=$('#amp');if(a)a.value=v;var t=$('#apv');if(t)t.textContent=v+' %';var w=$('#apw');if(w)w.textContent=ampNote();document.querySelectorAll('[data-amp]').forEach(function(b){b.classList.toggle('on',+b.dataset.amp===v)})}
function applyEq(){if(filt)filt.forEach(function(f,i){f.gain.value=S.eq[i]})}
V.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){qy=t.value;draw()}
  else if(t.dataset.eq!==undefined){S.eq[+t.dataset.eq]=+t.value;save();applyEq()}
  else if(t.id==='spd'){S.spd=+t.value;save();$('#spv').textContent=fmtR(S.spd)+' rpm'}
  else if(t.id==='amp'){setAmp(+t.value)}
});
V.addEventListener('change',function(e){
  if(e.target.id==='fi'||e.target.id==='fd'){add(e.target.files);e.target.value=''}
  else if(e.target.id==='rot'){S.rot=e.target.checked;save()}
  else if(e.target.id==='pn'){S.pn=e.target.checked;save()}
  else if(e.target.id==='rem'){S.rem=e.target.checked;save();$('#du').textContent=S.rem?'-'+fmt((A.duration||0)-A.currentTime):fmt(A.duration)}
});

var app=$('#app');
['dragenter','dragover'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();app.classList.add('drop')})});
['dragleave','drop'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();app.classList.remove('drop')})});
document.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files)add(e.dataTransfer.files)});
document.addEventListener('keydown',function(e){
  if(/INPUT|TEXTAREA/.test(e.target.tagName)||e.target.tagName==='BUTTON')return;
  if(e.code==='Space'){e.preventDefault();toggle()}
});
})();
</script>
</body>
</html>
